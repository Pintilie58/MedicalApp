name: mymedicalapp

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mma-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - mma-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  loinc:
    build:
      context: ./loinc_service
    container_name: mma-loinc
    expose:
      - "8000"
    restart: unless-stopped

  app:
    build:
      context: ./MedicalApp
    container_name: mma-app
    depends_on:
      sql:
        condition: service_healthy
      loinc:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=MedicalAppDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      EmailSettings__Password: ${BREVO_SMTP_PASSWORD:-}
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - mma-files:/app/files
    restart: unless-stopped

volumes:
  mma-sqldata:
  mma-files:
